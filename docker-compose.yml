version: '2.4'
services:
  db:
    image: postgis/postgis:14-3.4
    environment:
      POSTGRES_DB: heat
      POSTGRES_USER: heat
      POSTGRES_PASSWORD: ${DB_PASSWORD:-heat-local-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heat -d heat"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 2g
  backend:
    image: lct-heat-backend:0.9.1
    build: ./backend
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/heat
      DB_USER: heat
      DB_PASSWORD: ${DB_PASSWORD:-heat-local-dev}
      UPLOAD_DIRECTORY: /data/uploads
      MULTIPART_DIRECTORY: /data/tmp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 35s
    volumes:
      - uploads:/data/uploads
      - upload_tmp:/data/tmp
    mem_limit: ${BACKEND_MEMORY:-1g}
volumes:
  pgdata:
  uploads:
  upload_tmp:

